name: verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 연산 로직 검증
        run: npm test
      - name: 정적 내보내기
        run: npm run build
        env:
          BASE_PATH: ${{ github.event_name == 'push' && format('/{0}', github.event.repository.name) || '' }}
      - name: 브라우저 시나리오 검증
        run: |
          npx playwright install --with-deps chromium
          npm run smoke
      - name: 오프라인 배포본
        run: npx tsx tools/standalone.ts
      - name: 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: standalone-html
          path: dist/evacuation-planner.html
      - name: Pages 업로드
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
