<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 자판이 떠도 화면 크기를 바꾸지 않는다. 이름을 적는 동안 「화면이 작아」 안내로 바뀌지 않게 한다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
    <!-- 태블릿에서 홈 화면에 추가하면 주소 줄 없이 화면 가득 열린다. 저장해 두는 것은 없다 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="대피지도" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="description" content="점을 이어 우리 집을 그리고, 칸을 눌러 나가는 길을 찾는 초등학생용 화재 대피 학습 프로그램" />
    <meta name="theme-color" content="#fbf7ea" />
    <title>우리집 대피지도</title>
    <link rel="icon" href="./art/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
