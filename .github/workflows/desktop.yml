name: desktop installer

# 윈도우 설치 파일 (설계서 v1.18 §5.3).
# Pages 배포(deploy.yml)와 따로 돌지만 함께 올라간다(대장 #184) — deploy.yml 이 이 워크플로가 끝나기를 기다리고,
# 이 판의 설치 파일이 없으면 웹도 올리지 않는다.
# 산출물은 GitHub Release `desktop` 에 올린다. 언제나 가장 새 판의 파일만 둔다(대장 #180).
# 안내 페이지의 받기 단추가 이 파일을 가리켜 GitHub 이 받은 횟수를 센다(대장 #181).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: V2 의존성
        working-directory: V2
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 오프라인 배포본 (V2 HTML · 그림 · 음성 · 꾸러미)
        run: npx tsx tools/standalone.ts

      - name: 윈도우 설치 파일 빌드
        run: npm run desktop:build

      - name: 빌드본 실행 검증 (첫 화면 → 이름표 → 그리기 → 저장 · 바깥 요청 0건)
        run: npm run desktop:check -- --packaged

      - name: 자동 업데이트 검증 (받기 · 다른 파일 거부 · 무설치판 교체 · 설치판 조용히 설치)
        run: npm run desktop:update-check

      - name: Release `desktop` 에 가장 새 판만 두기
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TITLE="우리집 대피지도 ${VERSION} — 윈도우 프로그램과 오프라인 꾸러미"
          # 파일을 갈면 GitHub 이 센 받은 횟수가 0 으로 돌아간다. 갈기 전에 그때까지의 횟수를 Release 글의 장부로 옮겨 적는다(대장 #181)
          node tools/download-counts.mjs notes "$VERSION" > release/notes.md
          cat release/notes.md
          if gh release view desktop >/dev/null 2>&1; then
            gh release edit desktop --title "$TITLE" --notes-file release/notes.md --target "$GITHUB_SHA"
          else
            gh release create desktop --title "$TITLE" --notes-file release/notes.md --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload desktop "release/HomeEscapeMap-Setup-${VERSION}.exe" "release/HomeEscapeMap-Portable-${VERSION}.exe" dist/home-escape-map-offline.zip --clobber
          # 가장 새 판의 파일만 남긴다(대장 #180)
          for NAME in $(gh release view desktop --json assets --jq '.assets[].name'); do
            case "$NAME" in
              "HomeEscapeMap-Setup-${VERSION}.exe"|"HomeEscapeMap-Portable-${VERSION}.exe"|home-escape-map-offline.zip) ;;
              *) echo "지난 판을 지운다: $NAME"; gh release delete-asset desktop "$NAME" -y ;;
            esac
          done
          # 판마다 꼬리표를 남긴다 — 파일은 가장 새 판만 두지만 어느 커밋이 어느 판인지는 남는다(대장 #180)
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/v${VERSION}" -f "sha=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "꼬리표 v${VERSION} 를 달았다"
          else
            echo "꼬리표 v${VERSION} 는 이미 있다"
          fi
