name: verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 같은 커밋의 desktop.yml 실행 상태를 묻는 데 필요하다
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    # Playwright 가 지원하는 판으로 못 박는다. ubuntu-latest 가 26.04 로 바뀌면 Chromium 을 깔지 못한다
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 꾸러미와 설치 파일은 V2 로 만든다. 그래서 V2 의존성을 먼저 깐다.
      - name: V2 의존성
        working-directory: V2
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 콘텐츠 검증
        run: npm run validate

      # V2 를 오프라인 판으로 묶어 HTML·그림·음성·꾸러미 ZIP 을 dist/ 에 만든다.
      # pack.ts 가 이 ZIP 을 싣기 때문에 내보내기보다 먼저 돌린다.
      - name: 오프라인 배포본
        run: npx tsx tools/standalone.ts

      # next build 뒤 tools/pack.ts 가 매니페스트·서비스 워커·꾸러미·설치 파일 복사를 마감한다.
      # 검증용 내보내기에는 설치 파일이 없어도 된다 — 안내 페이지는 준비 중 상태로 검증한다.
      - name: 정적 내보내기 (검증용)
        run: npm run build

      # 산출물(오프라인 HTML 4MB · 선캐시 · 꾸러미)까지 함께 보려고 빌드 뒤에 돌린다.
      - name: 연산 로직 · 배포 전 점검
        run: npm test

      - name: 브라우저 시나리오 검증
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      # V2 는 독립 프로젝트다(V2/docs/DESIGN.md §12). 자기 검증을 통과해야 함께 실린다.
      # 브라우저는 바로 위 단계에서 깔았다 — V2 도 같은 Playwright 판을 쓴다.
      - name: V2 검증
        working-directory: V2
        run: npm run verify

      # 윈도우 설치 파일은 desktop.yml 이 같은 커밋으로 만들어 Release `desktop` 에 올린다. 받는 곳을 같은
      # 사이트 안에 두려고(저장소는 대장 #167 에서 공개로 바꿨다) 여기서 받아 dist/desktop/ 에 두면 pack.ts 가 Pages 의 download/ 에 함께 싣는다.
      # 같은 커밋의 desktop.yml 이 끝날 때까지(최대 15분) 기다려 사이트의 설치 파일이 늘 이 커밋과 같게 한다.
      # 그래도 없으면(첫 배포·실패) 싣지 않고 안내 페이지는 준비 중이라고 말한다.
      - name: 윈도우 설치 파일 받기 (같은 커밋의 Release desktop)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/desktop.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>&1) || true
            echo "desktop.yml: ${STATUS:-없음}"
            case "$STATUS" in
              "completed success") break ;;
              "completed "*) echo "desktop.yml 이 실패했다 — 지난 Release 산출물을 쓴다"; break ;;
            esac
            sleep 30
          done
          mkdir -p dist/desktop
          VERSION=$(node -p "require('./package.json').version")
          if gh release view desktop >/dev/null 2>&1; then
            gh release download desktop -p "HomeEscapeMap-*-${VERSION}.exe" -D dist/desktop --clobber || true
            # 판 기록(대장 #130 · #162) — 바로 앞 한 판의 설치판과 올린 날짜도 함께 싣는다. Release 에는 지금 판과 바로 앞 판만 남긴다
            for OLD in $(node -p "require('fs').readFileSync('CHANGELOG.md','utf8').match(/^## \\d+\\.\\d+\\.\\d+/gm).slice(1,2).map((s)=>s.slice(3)).join(' ')"); do
              gh release download desktop -p "HomeEscapeMap-Setup-${OLD}.exe" -D dist/desktop --clobber || true
            done
            gh release view desktop --json assets --jq '[.assets[] | {name, createdAt}]' > dist/desktop/assets.json || true
          fi
          ls -la dist/desktop

      # 프로젝트 페이지는 하위 경로에 게시되므로 기준 경로를 주어 다시 내보낸다.
      - name: 배포용 정적 내보내기
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      # pack.ts 가 선캐시 목록을 만든 뒤에 넣는다. V2 는 지금 판의 서비스 워커에 들어가지 않는다.
      # 기본 주소를 열면 V2 로 간다(대장 #111). download/ 와 latest.json 은 설치판이 쓰므로 그대로 둔다.
      # root-sw.js 는 이전 판의 워커를 넘겨받아 옛 저장본을 지우고 첫 페이지만 저장한다(대장 #110).
      - name: V2 를 사이트에 싣고 첫 페이지로 잇기
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp -r V2/dist out/V2
          cp V2/root-redirect.html out/index.html
          cp V2/root-sw.js out/sw.js

      - name: Pages 업로드
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
          retention-days: 1

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
