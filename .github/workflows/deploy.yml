name: verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 콘텐츠 검증
        run: npm run validate

      # 오프라인 배포본은 out/ 을 오프라인 모드로 다시 내보낸다.
      # 그래서 배포용 내보내기보다 반드시 먼저 돌려야 한다. HTML·음성·꾸러미 ZIP 을 dist/ 에 만든다.
      - name: 오프라인 배포본
        run: npx tsx tools/standalone.ts

      # next build 뒤 tools/pack.ts 가 매니페스트·서비스 워커·꾸러미·설치 파일 복사를 마감한다.
      # 검증용 내보내기에는 설치 파일이 없어도 된다 — 안내 페이지는 준비 중 상태로 검증한다.
      - name: 정적 내보내기 (검증용)
        run: npm run build

      # 산출물(오프라인 HTML 4MB · 선캐시 · 꾸러미)까지 함께 보려고 빌드 뒤에 돌린다.
      - name: 연산 로직 · 배포 전 점검
        run: npm test

      - name: 브라우저 시나리오 검증
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      - name: 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: offline-classroom-bundle
          path: dist/

      # 윈도우 설치 파일은 desktop.yml 이 같은 커밋으로 만들어 Release `desktop` 에 올린다. 저장소가 비공개라
      # 그 주소는 공개 링크가 아니므로, 여기서 받아 dist/desktop/ 에 두면 pack.ts 가 Pages 의 download/ 에 함께 싣는다.
      # 같은 커밋의 desktop.yml 이 끝날 때까지(최대 15분) 기다려 사이트의 설치 파일이 늘 이 커밋과 같게 한다.
      # 그래도 없으면(첫 배포·실패) 싣지 않고 안내 페이지는 준비 중이라고 말한다.
      - name: 윈도우 설치 파일 받기 (같은 커밋의 Release desktop)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(gh run list --workflow desktop.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "")
            echo "desktop.yml: ${STATUS:-없음}"
            case "$STATUS" in
              "completed success") break ;;
              "completed "*) echo "desktop.yml 이 실패했다 — 지난 Release 산출물을 쓴다"; break ;;
            esac
            sleep 30
          done
          mkdir -p dist/desktop
          VERSION=$(node -p "require('./package.json').version")
          if gh release view desktop >/dev/null 2>&1; then
            gh release download desktop -p "HomeEscapeMap-*-${VERSION}.exe" -D dist/desktop --clobber || true
          fi
          ls -la dist/desktop

      # 프로젝트 페이지는 하위 경로에 게시되므로 기준 경로를 주어 다시 내보낸다.
      - name: 배포용 정적 내보내기
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Pages 업로드
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
